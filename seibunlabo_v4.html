<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成分ラボ｜化粧品成分 1発検索</title>
<style>
  :root{
    --teal:#0d9488; --teal-d:#0f766e; --mint:#ccfbf1; --bg:#f8fafc;
    --card:#ffffff; --text:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --warn:#d97706; --danger:#dc2626; --ok:#16a34a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6}
  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--teal-d);margin-bottom:8px}
  .brand .flask{font-size:22px}
  .searchbox{display:flex;gap:8px}
  #q{flex:1;min-height:48px;border:2px solid var(--teal);border-radius:12px;padding:0 14px;font-size:16px;outline:none}
  #q:focus{box-shadow:0 0 0 3px var(--mint)}
  #clearBtn{min-width:48px;min-height:48px;border:none;border-radius:12px;background:var(--mint);color:var(--teal-d);font-size:18px;font-weight:700;cursor:pointer}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
  .wrap{max-width:860px;margin:0 auto;padding:0 14px 40px}
  .hint{color:var(--sub);font-size:13px;padding:6px 4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .card-head{padding:16px;cursor:pointer}
  .cname{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--mint);color:var(--teal-d)}
  .inci{font-size:13px;color:var(--sub);margin-top:2px}
  .cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .cat{font-size:12px;background:#f1f5f9;color:var(--sub);border-radius:6px;padding:2px 8px}
  .eff-quick{margin-top:10px;font-size:14px;color:var(--text)}
  details{border-top:1px solid var(--line)}
  summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-height:48px}
  summary::-webkit-details-marker{display:none}
  summary .arrow{margin-left:auto;color:var(--sub);transition:transform .2s}
  details[open] summary .arrow{transform:rotate(180deg)}
  .sec-body{padding:0 16px 16px;font-size:14px}
  .sec-body ul{padding-left:20px}
  .sec-body li{margin-bottom:4px}
  .meter{display:flex;gap:5px;align-items:center;margin:8px 0 6px}
  .dot{width:22px;height:10px;border-radius:5px;background:#e2e8f0}
  .dot.on{background:var(--teal)}
  .dot.on.warn{background:var(--warn)}
  .dot.on.danger{background:var(--danger)}
  .meter-label{font-size:13px;font-weight:700;margin-left:6px}
  .sim-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sim-row::-webkit-scrollbar{display:none}
  .sim-chip{flex:0 0 auto;min-height:44px;padding:9px 16px;border-radius:12px;background:var(--mint);color:var(--teal-d);font-weight:700;font-size:14px;border:none;cursor:pointer}
  .reg-box{background:#f8fafc;border-left:4px solid var(--teal);border-radius:6px;padding:10px 12px}
  .empty{text-align:center;color:var(--sub);padding:60px 20px}
  .empty .big{font-size:44px;margin-bottom:12px}
  .hist-title{font-weight:800;font-size:15px;margin:20px 0 8px;color:var(--teal-d)}
  .web-btn{min-height:48px;padding:10px 22px;border-radius:12px;border:none;background:var(--teal);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:14px}
  .web-btn:active{background:var(--teal-d)}
  .web-link{display:inline-block;margin-top:10px;color:var(--teal-d);font-weight:700;font-size:14px;text-decoration:none}
  .web-badge{background:#e0e7ff;color:#3730a3}
  .hist-row{display:flex;gap:8px;flex-wrap:wrap}
  footer{margin-top:30px;padding:16px;background:#f1f5f9;border-radius:12px;font-size:12px;color:var(--sub);line-height:1.8}
  .num{color:var(--teal-d);font-weight:700}
  @media(min-width:768px){ .card-head{padding:20px} .cname{font-size:22px} }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="flask">🧪</span>成分ラボ <span style="font-size:11px;color:var(--sub);font-weight:500">化粧品成分を1発検索</span></div>
  <div class="searchbox">
    <input id="q" type="search" placeholder="成分名を入力（例：ナイアシンアミド）" autocomplete="off">
    <button id="clearBtn" aria-label="クリア">×</button>
  </div>
</header>

<div class="chips" id="catChips"></div>

<div class="wrap">
  <div class="hint" id="hint"></div>
  <div id="results"></div>
  <div id="histArea"></div>

  </footer>
</div>

      updateDbStamp();
    }
  }catch(e){ /* オフライン時は内蔵DBのまま */ }
}
function updateDbStamp(){
  const ts = localStorage.getItem(DB_TS_KEY);
  const el = document.querySelector('#dbStamp');
  if(el) el.textContent = ts ? 'DB最終同期：' + new Date(+ts).toLocaleString('ja-JP') : 'DB：内蔵版（未同期）';
}
(function(){
  try{
    const cached = localStorage.getItem('seibun_db_remote');
    if(cached){
      const d = JSON.parse(cached);
      if(Array.isArray(d) && d.length > 0) DATA = d;
    }
  }catch(e){}
})();
</script>
<script>
const $ = s => document.querySelector(s);
const histKey = 'seibun_hist';

function meter(lv){
  const cls = lv<=2 ? '' : (lv===3 ? 'warn' : 'danger');
  let dots='';
  for(let i=1;i<=5;i++) dots += `<span class="dot ${i<=lv?'on '+cls:''}"></span>`;
  const labels={1:'低リスク',2:'やや低',3:'注意',4:'やや高',5:'高リスク'};
  return `<div class="meter">${dots}<span class="meter-label" style="color:${lv<=2?'var(--ok)':lv===3?'var(--warn)':'var(--danger)'}">${labels[lv]}</span></div>`;
}

function cardHTML(d, open=false){
  const sim = d.sim.map(s=>`<button class="sim-chip" onclick="searchFor('${s}')">${s}</button>`).join('');
  return `
  <div class="card">
    <div class="card-head" onclick="this.parentElement.querySelectorAll('details').forEach(t=>{})">
      <div class="cname">${d.n} <span class="badge">DB収録</span></div>
      <div class="inci">表示名称（INCI）：${d.inci}${d.alias.length? ' ／ 別名：'+d.alias.join('、'):''}</div>
      <div class="cats">${d.cat.map(c=>`<span class="cat">${c}</span>`).join('')}</div>
      <div class="eff-quick">✨ ${d.eff.slice(0,3).join('・')}</div>
    </div>
    <details ${open?'open':''}>
      <summary>✨ 効果・効能 <span class="arrow">▼</span></summary>
      <div class="sec-body"><ul>${d.eff.map(e=>`<li>${e}</li>`).join('')}</ul></div>
    </details>
    <details>
      <summary>⚠️ 安全性・副作用リスク <span class="arrow">▼</span></summary>
      <div class="sec-body">${meter(d.saf)}<p>${d.safNote}</p></div>
    </details>
    <details>
      <summary>⚖️ 法的規制（日本） <span class="arrow">▼</span></summary>
      <div class="sec-body"><div class="reg-box">${d.reg}</div></div>
    </details>
    <details>
      <summary>🔄 類似成分・代替成分 <span class="arrow">▼</span></summary>
      <div class="sec-body"><div class="sim-row">${sim}</div></div>
    </details>
  </div>`;
}

let currentCat = 'すべて';

function norm(s){
  if(!s) return '';
  s = (''+s).toLowerCase();
  s = s.replace(/[\u30A1-\u30F6]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60));
  s = s.replace(/γ|gamma|ガンマ/g,'がんま')
       .replace(/α|alpha|アルファ/g,'あるふぁ')
       .replace(/β|beta|ベータ/g,'べーた')
       .replace(/δ|delta|デルタ/g,'でるた')
       .replace(/ε|epsilon/g,'いぷしろん')
       .replace(/l-|d-/g,'');
  return s.replace(/[\s\-‐‑−―・=＝\/()（）,、.。　]/g,'');
}

function scoreOf(d, qk){
  const n = norm(d.n), inci = norm(d.inci), als = d.alias.map(norm), eff = norm(d.eff.join(''));
  if(n === qk) return 100;
  if(als.some(a => a === qk)) return 95;
  if(n.startsWith(qk) || als.some(a => a.startsWith(qk))) return 80;
  if(n.includes(qk)) return 70;
  if(als.some(a => a.includes(qk))) return 65;
  if(inci.includes(qk)) return 60;
  if(eff.includes(qk)) return 20;
  return 0;
}

function render(){
  const q = $('#q').value.trim();
  const qk = norm(q);
  let list;
  const byCat = d => currentCat==='すべて' || d.cat.includes(currentCat);
  if(!qk){
    list = DATA.filter(byCat);
  }else{
    list = DATA.filter(byCat).map(d=>({d, s:scoreOf(d,qk)}))
      .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.d);
  }
  $('#hint').textContent = qk ? `「${q}」の検索結果：${list.length}件（関連度順）` : `収録 ${DATA.length} 成分から検索できます（通称・商品名・ひらがな・英名OK）`;
  if(!list.length){
    $('#results').innerHTML = qk ? `<div class="empty"><div class="big">🔍</div>内蔵DBに「${q}」はありません。<br><button class="web-btn" onclick="webSearch()">🌐 ネットで「${q}」をリアルタイム検索</button></div>` : '';
  }else{
    $('#results').innerHTML = list.map((d,i)=>cardHTML(d, list.length===1)).join('') + (qk ? `<div style="text-align:center;margin:6px 0 14px"><button class="web-btn" onclick="webSearch()">🌐 「${q}」をネットでも検索</button></div>` : '');
    if(list.length===1) addHist(list[0].n);
  }
  renderHist();
}

function renderCats(){
  const cats = ['すべて', ...new Set(DATA.flatMap(d=>d.cat))];
  $('#catChips').innerHTML = cats.map(c=>`<button class="chip ${c===currentCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){ currentCat=c; renderCats(); render(); updateDbStamp(); refreshDB(); }

function searchFor(name){ $('#q').value=name; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function addHist(n){
  let h = JSON.parse(localStorage.getItem(histKey)||'[]');
  h = [n, ...h.filter(x=>x!==n)].slice(0,8);
  localStorage.setItem(histKey, JSON.stringify(h));
}
function renderHist(){
  const h = JSON.parse(localStorage.getItem(histKey)||'[]');
  $('#histArea').innerHTML = h.length ? `<div class="hist-title">🕘 最近チェックした成分</div><div class="hist-row">${h.map(n=>`<button class="sim-chip" onclick="searchFor('${n}')">${n}</button>`).join('')}</div>` : '';
}

async function webSearch(){
  const q = $('#q').value.trim();
  if(!q) return;
  const box = $('#results');
  box.innerHTML = '<div class="empty"><div class="big">⏳</div>ネットで「'+q+'」を検索中...</div>';
  window.scrollTo({top:0,behavior:'smooth'});
  const queries = [q + ' 成分 化粧品', q];
  try{
    let pages = [];
    for(const gq of queries){
      const url = 'https://ja.wikipedia.org/w/api.php?action=query&prop=extracts|info&exintro&explaintext&inprop=url&redirects=1&format=json&origin=*&generator=search&gsrsearch=' + encodeURIComponent(gq) + '&gsrlimit=5';
      const r = await fetch(url);
      const j = await r.json();
      pages = (j.query && j.query.pages) ? Object.values(j.query.pages) : [];
      if(pages.length) break;
    }
    if(!pages.length){
      box.innerHTML = '<div class="empty"><div class="big">😕</div>ネットでも「'+q+'」は見つかりませんでした。<br>表記を変えて試してください。</div>';
      return;
    }
    box.innerHTML = '<div class="hist-title">🌐 ネット検索結果（Wikipediaより・リアルタイム取得）</div>' + pages.map(p=>`
      <div class="card"><div class="card-head">
        <div class="cname" style="font-size:17px">${p.title} <span class="badge web-badge">ネット検索</span></div>
        <div style="margin-top:8px;font-size:14px">${(p.extract||'（概要なし）').slice(0,300)}${(p.extract||'').length>300?'…':''}</div>
        <a class="web-link" href="${p.fullurl}" target="_blank" rel="noopener">Wikipediaで詳しく読む →</a>
      </div></div>`).join('');
  }catch(e){
    box.innerHTML = '<div class="empty"><div class="big">⚠️</div>通信エラーです。ネット接続を確認してもう一度お試しください。</div>';
  }
}

$('#q').addEventListener('input', render);
$('#clearBtn').addEventListener('click', ()=>{ $('#q').value=''; render(); $('#q').focus(); });

$('#dbCount').textContent = DATA.length;
renderCats(); render(); updateDbStamp(); refreshDB();
</script>
</body>
</html>
